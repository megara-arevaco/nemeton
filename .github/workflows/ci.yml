name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "windows-validation/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/heads/windows-validation/')
        run: pnpm dist:win:installer

      - name: Smoke test the installed Windows application
        if: startsWith(github.ref, 'refs/heads/windows-validation/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $destination = Join-Path $env:RUNNER_TEMP "Nemeton-installed-smoke"
          $installer = Resolve-Path "apps/desktop/release/Nemeton-Setup-$version.exe"
          $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installer failed." }
          node scripts/smoke-packaged.mjs "$destination/Nemeton.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed application smoke test failed." }

      - name: Upload Windows installer
        if: startsWith(github.ref, 'refs/heads/windows-validation/')
        uses: actions/upload-artifact@v4
        with:
          name: Nemeton-Windows-installer
          path: apps/desktop/release/Nemeton-Setup-*.exe
          if-no-files-found: error
