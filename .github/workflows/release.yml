name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build installer and portable executable
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm dist:win

      - name: Verify signatures when a signing certificate is configured
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            foreach ($artifact in @("apps/desktop/release/Nemeton-Setup-$version.exe", "apps/desktop/release/Nemeton-Portable-$version.exe")) {
              if ((Get-AuthenticodeSignature $artifact).Status -ne 'Valid') {
                throw "The release artifact does not have a valid Authenticode signature."
              }
            }
          }

      - name: Smoke test the packaged Windows application
        run: node scripts/smoke-packaged.mjs apps/desktop/release/win-unpacked/Nemeton.exe

      - name: Smoke test the installed Windows application
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $destination = Join-Path $env:RUNNER_TEMP "Nemeton-installed-smoke"
          $installer = Resolve-Path "apps/desktop/release/Nemeton-Setup-$version.exe"
          $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installer failed." }
          try {
            node scripts/smoke-packaged.mjs "$destination/Nemeton.exe"
            if ($LASTEXITCODE -ne 0) { throw "Installed application smoke test failed." }
          } finally {
            $uninstaller = Get-ChildItem -LiteralPath $destination -Filter 'Uninstall*.exe' | Select-Object -First 1
            if ($uninstaller) { Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait }
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDirectory = "apps/desktop/release"
          $artifacts = @(
            "$releaseDirectory/Nemeton-Setup-$version.exe"
            "$releaseDirectory/Nemeton-Portable-$version.exe"
          )
          $checksums = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $artifact)"
          }
          $checksums | Set-Content -Encoding utf8 "$releaseDirectory/SHA256SUMS.txt"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $artifacts = @(
            "apps/desktop/release/Nemeton-Setup-$version.exe"
            "apps/desktop/release/Nemeton-Portable-$version.exe"
            "apps/desktop/release/SHA256SUMS.txt"
            "apps/desktop/release/latest.yml"
            "apps/desktop/release/Nemeton-Setup-$version.exe.blockmap"
          )
          gh release create $env:GITHUB_REF_NAME @artifacts `
            --generate-notes `
            --title "Nemeton $version" `
            --verify-tag

  release-linux:
    name: Build Linux release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Debian package and AppImage
        run: pnpm dist:linux

      - name: Generate checksums
        working-directory: apps/desktop/release
        run: sha256sum Nemeton-*.deb Nemeton-*.AppImage > SHA256SUMS-linux.txt

      - name: Upload Linux packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            apps/desktop/release/Nemeton-*.deb \
            apps/desktop/release/Nemeton-*.AppImage \
            apps/desktop/release/SHA256SUMS-linux.txt
