name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build installer and portable executable
        run: pnpm dist:win

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDirectory = "apps/desktop/release"
          $artifacts = @(
            "$releaseDirectory/Nemeton Setup $version.exe"
            "$releaseDirectory/Nemeton Portable $version.exe"
          )
          $checksums = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $artifact)"
          }
          $checksums | Set-Content -Encoding utf8 "$releaseDirectory/SHA256SUMS.txt"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $artifacts = @(
            "apps/desktop/release/Nemeton Setup $version.exe"
            "apps/desktop/release/Nemeton Portable $version.exe"
            "apps/desktop/release/SHA256SUMS.txt"
          )
          gh release create $env:GITHUB_REF_NAME @artifacts `
            --generate-notes `
            --title "Nemeton $version" `
            --verify-tag
